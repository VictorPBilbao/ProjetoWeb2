<section>
  <div style="text-align: center;"> <div class="titulo-wrapper">
    <svg class="titulo-blob" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
       <path fill="#030e6d" d="M46.9,-64.5C62.6,-53.2,78.3,-41.9,78.6,-28.4C79,-15,64.1,0.5,54.9,14.4C45.7,28.4,42.1,40.7,33.9,41.7C25.7,42.7,12.9,32.4,2.4,29.1C-8.1,25.8,-16.1,29.6,-30.2,30.4C-44.2,31.3,-64.2,29.4,-71.9,20C-79.5,10.7,-74.8,-6,-67,-19.2C-59.2,-32.3,-48.3,-41.9,-36.6,-54.5C-25,-67.1,-12.5,-82.7,1.6,-84.9C15.6,-87.1,31.3,-75.8,46.9,-64.5Z" transform="translate(100 100)"/>
    </svg>
    <h1>Gerenciamento de Categorias de Equipamentos</h1>
  </div>
</div>
  
  <hr>
  <div>
    <div class="container">
    <h2>{{ modoEdicao ? 'Editar Categoria' : 'Adicionar Nova Categoria' }}</h2>

<form #formCategoria="ngForm" (ngSubmit)="salvarCategoria()" class="form-categoria">
  <label for="nomeCategoria"><strong>Nome:</strong></label>
  <input
    type="text"
    id="nomeCategoria"
    name="nomeCategoria"
    placeholder="Ex: Notebook, Monitor"
    [(ngModel)]="categoriaAtual.nome"
    required
    #nomeInput="ngModel"
  >
  
  <button type="submit" 
          [disabled]="formCategoria.invalid || !categoriaAtual.nome?.trim()" 
          class="btn-editar">
    {{ modoEdicao ? 'Atualizar Categoria' : 'Adicionar Categoria' }}
  </button>
  
  <button type="button" 
          *ngIf="modoEdicao" 
          (click)="cancelarEdicao()" 
          class="btn-cancelar">
    Cancelar Edição
  </button>

  <div *ngIf="nomeInput.invalid && (nomeInput.dirty || nomeInput.touched)" class="erro-form">
    <small *ngIf="nomeInput.errors?.['required']">O nome da categoria é obrigatório.</small>
  </div>
</form>

  </div>

  <hr style="margin-top: 20px;">


    <div class="budgets-list-container">
  <h2>Categorias Cadastradas</h2>

  <div *ngFor="let cat of listaCategorias" class="categoria-card">
    <div class="categoria-nome">{{ cat.nome }}</div>
    <div class="acoes">
      <button type="button" class="btn-editar" (click)="editarCategoria(cat)">Editar</button>
      <button type="button" class="btn-excluir" (click)="excluirCategoria(cat.id)">Excluir</button>
    </div>
  </div>

  <div *ngIf="!listaCategorias || listaCategorias.length === 0" style="text-align: center; font-style: italic; margin-top: 10px;">
    Nenhuma categoria cadastrada ainda.
  </div>
</div>
</div>


</section>
