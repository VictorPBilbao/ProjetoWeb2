<section>
  <div class="payment-wrapper">
    <div class="center-container">
      <div class="title-container">
        <div class="blob-wrapper">
          <img src="/images/blob.png" alt="Decorativo" class="titulo-blob" />
        </div>
        <div class="titulo-wrapper">
          <h1 class="solicitation-title">
            <i class="fas fa-money-bill-wave me-2"></i> PAGAMENTOS
          </h1>
        </div>
      </div>
    </div>

    <div class="container">
      <form (ngSubmit)="submitForm()" #pagamentoForm="ngForm">
        <!-- Linha de campos lado a lado -->
        <div class="input-row">
          <!-- Tipo de Serviço -->
          <div class="form-group">
            <label for="tipoServico">Tipo de Serviço</label>
            <input
              type="text"
              class="form-control"
              id="tipoServico"
              [(ngModel)]="pagamento.tipoServico"
              name="tipoServico"
              readonly
              required
            />
          </div>

          <!-- Data do Serviço -->
          <div class="form-group">
            <label for="dataServico">Data do Serviço</label>
            <input
              type="date"
              class="form-control"
              id="dataServico"
              [(ngModel)]="pagamento.dataServico"
              name="dataServico"
              readonly
              required
            />
          </div>
        </div>

        <!-- Linha de campos lado a lado -->
        <div class="input-row">
          <!-- Solicitação que o cliente deseja pagar -->
          <div class="form-group">
            <label for="task">Solicitação</label>
            <input
              type="text"
              class="form-control"
              id="task"
              [(ngModel)]="pagamento.task"
              name="task"
              readonly
              required
            />
          </div>

          <!-- Empresa e CNPJ -->
          <div class="form-group">
            <label for="empresa">Nome da Empresa</label>
            <input
              type="text"
              class="form-control"
              id="empresa"
              [(ngModel)]="pagamento.empresa"
              name="empresa"
              readonly
              required
            />
          </div>
        </div>

        <!-- Linha de campos lado a lado -->
        <div class="input-row">
          <!-- CNPJ -->
          <div class="form-group">
            <label for="cnpj">CNPJ</label>
            <input
              type="text"
              class="form-control"
              id="cnpj"
              [(ngModel)]="pagamento.cnpj"
              name="cnpj"
              readonly
              required
            />
          </div>
          <!-- Valor -->
          <div class="form-group">
            <label for="valor">Valor (R$)</label>
            <input
              type="number"
              class="form-control"
              id="valor"
              [(ngModel)]="pagamento.valor"
              name="valor"
              step="0.01"
              readonly
              required
            />
          </div>
        </div>

        <!-- Linha de campos lado a lado -->
        <div class="input-row">
          <!-- Tipo de Pagamento -->
          <div class="form-group">
            <label for="tipoPagamento">Tipo de Pagamento</label>
            <select
              class="form-control"
              id="tipoPagamento"
              [(ngModel)]="pagamento.tipoPagamento"
              name="tipoPagamento"
              (change)="onTipoPagamentoChange()"
              required
            >
              <option value="" disabled selected>Selecione...</option>
              <option value="BOLETO">Boleto</option>
              <option value="CARTAO">Cartão de Crédito</option>
              <option value="PIX">PIX</option>
            </select>
          </div>

          <!-- Boleto -->
          <div
            *ngIf="pagamento.tipoPagamento === 'BOLETO'"
            class="alert alert-info"
          >
            <p>
              Código de barras: <strong>{{ codigoBarras }}</strong>
            </p>
          </div>
        </div>

        <!-- Linha de campos lado a lado (Cartão) -->
        <div *ngIf="pagamento.tipoPagamento === 'CARTAO'" class="input-row">
          <!-- Número do Cartão -->
          <div class="form-group">
            <label for="numeroCartao">Número do Cartão</label>
            <input
              type="text"
              class="form-control"
              id="numeroCartao"
              [(ngModel)]="pagamento.numeroCartao"
              name="numeroCartao"
              required
            />
          </div>

          <!-- Vencimento -->
          <div class="form-group">
            <label for="vencimentoCartao">Vencimento</label>
            <input
              type="text"
              class="form-control"
              id="vencimentoCartao"
              [(ngModel)]="pagamento.vencimentoCartao"
              name="vencimentoCartao"
              placeholder="MM/AA"
              required
            />
          </div>
        </div>

        <!-- Linha de campos lado a lado (Cartão) -->
        <div *ngIf="pagamento.tipoPagamento === 'CARTAO'" class="input-row">
          <!-- Nome do Titular -->
          <div class="form-group">
            <label for="nomeTitular">Nome do Titular</label>
            <input
              type="text"
              class="form-control"
              id="nomeTitular"
              [(ngModel)]="pagamento.nomeTitular"
              name="nomeTitular"
              required
            />
          </div>

          <!-- Parcelas -->
          <div class="form-group">
            <label for="parcelas">Parcelas</label>
            <select
              class="form-control"
              id="parcelas"
              [(ngModel)]="pagamento.parcelas"
              name="parcelas"
              required
            >
              <option *ngFor="let parcela of opcoesParcelas" [value]="parcela">
                {{ parcela }}x
              </option>
            </select>
          </div>
        </div>

        <!-- Linha de campos lado a lado (PIX) -->
        <div *ngIf="pagamento.tipoPagamento === 'PIX'" class="input-row">
          <!-- Chave PIX -->
          <div class="form-group">
            <p class="pix-text">
              Chave PIX: <strong id="chavePix">{{ chavePix }}</strong>
            </p>

            <!-- Botão de copiar -->
            <button type="button" class="btn-copiar" (click)="copiarChavePix()">
              Copiar chave
            </button>
          </div>
        </div>

        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="!pagamentoForm.valid"
        >
          PAGAR
        </button>
      </form>

      <!-- Spinner de Carregamento (loading) -->
      <div *ngIf="isLoading" class="loading-overlay">
        <div class="loading-content">
          <span>Verificando...</span>
          <div class="spinner"></div>
        </div>
      </div>

      <!-- Modal de Confirmação -->
      <div *ngIf="isModalVisible && !isLoading" class="modal-overlay">
        <div class="modal-content">
          <h5>Pagamento confirmado com sucesso!</h5>
          <button (click)="fecharModal()">OK</button>
        </div>
      </div>
    </div>
  </div>
</section>
