<section class="solicitation-section">
    <div class="wave-background">
        <!-- wave -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path fill="#000b76" fill-opacity="0.5" d="M0,192L20,192C40,192,80,192,120,208C160,224,200,256,240,277.3C280,299,320,309,360,277.3C400,245,440,171,480,165.3C520,160,560,224,600,250.7C640,277,680,267,720,272C760,277,800,299,840,282.7C880,267,920,213,960,202.7C1000,192,1040,224,1080,229.3C1120,235,1160,213,1200,224C1240,235,1280,277,1320,250.7C1360,224,1400,128,1420,80L1440,32L1440,0L1420,0C1400,0,1360,0,1320,0C1280,0,1240,0,1200,0C1160,0,1120,0,1080,0C1040,0,1000,0,960,0C920,0,880,0,840,0C800,0,760,0,720,0C680,0,640,0,600,0C560,0,520,0,480,0C440,0,400,0,360,0C320,0,280,0,240,0C200,0,160,0,120,0C80,0,40,0,20,0L0,0Z"></path>
        </svg>
      </div>
    <br>
    <h2 class="solicitation-title">NOVA SOLICITAÇÃO</h2>
         <div class="solicitation-container">
            <div class="solicitation-card">
            <!-- cabeçalho -->
            <table class="solicitation-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>DATA</th>
                  <th>HORA</th>
                  <th>ESTADO</th>
                  <th>ORÇAMENTO (R$)</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>{{ solicitation.id }}</td>
                  <td>{{ solicitation.date }}</td>
                  <td>{{ solicitation.time }}</td>
                  <td>
                    <span class="status status-open">{{ solicitation.status }}</span>
                  </td>
                  <td>
                    <input type="text" [(ngModel)]="solicitation.budget" 
                           class="budget-input" placeholder="0,00">
                  </td>
                </tr>
              </tbody>
            </table>
        
            <!-- combos -->
            <div class="form-section">
              <div class="form-row">
                <div class="form-group">
                  <label>CATEGORIA</label>
                  <select [(ngModel)]="solicitation.category" class="form-select" required>
                    <option value="">Selecione...</option>
                    <option *ngFor="let category of categories" [value]="category">
                      {{ category }}
                    </option>
                  </select>
                </div>
                
                <div class="form-group">
                  <label>MARCA</label>
                  <select [(ngModel)]="solicitation.brand" class="form-select" required>
                    <option value="">Selecione...</option>
                    <option *ngFor="let brand of brands" [value]="brand">
                      {{ brand }}
                    </option>
                  </select>
                </div>
              </div>

                <div class="form-group">
                  <label>SERVIÇO</label>
                  <select [(ngModel)]="solicitation.service" class="form-select" required>
                    <option value="">Selecione...</option>
                    <option *ngFor="let service of services" [value]="service">
                      {{ service }}
                    </option>
                  </select>
                </div>
              </div>
        
              <!-- campos de texto -->
              <div class="form-group">
                <label>DESCRIÇÃO DO SERVIÇO</label>
                <textarea [(ngModel)]="solicitation.description" 
                         class="form-textarea" rows="3" required></textarea>
              </div>
        
              <div class="form-group">
                <label>DEFEITO RELATADO</label>
                <textarea [(ngModel)]="solicitation.defect" 
                         class="form-textarea" rows="3" required></textarea>
              </div>
  
              <button (click)="register()" class="register-button">
                CADASTRAR SOLICITAÇÃO
              </button>
            </div>
        </div>
  </section>
