<section class="solicitation-section">
  <!-- Container branco centralizado -->
  <div class="solicitation-wrapper">

    <!-- Título com blob -->
    <div class="container-do-titulo">
      <div class="blob-wrapper">
        <img src="/images/blob.png" alt="Decorativo" class="titulo-blob" />
      </div>
      <div class="titulo-wrapper">
        <h1 class="solicitation-title">
          <i class="fas fa-plus-circle me-2"></i> SOLICITAÇÃO
        </h1>
      </div>
    </div>

    <!-- Container da solicitação -->
    <div class="solicitation-container">
      <div class="solicitation-card">
        <form #registerForm="ngForm" (ngSubmit)="createSolicitacao()" class="solicitation-form">          <!-- LINHA de campos -->
          <div class="form-row">
            <div class="form-group">
              <label for="categoria">TIPO DE EQUIPAMENTO</label>
              <select id="categoria" name="categoria" [(ngModel)]="solicitation.categoria" class="form-select" required>
                <option value="">Selecione</option>
                <option *ngFor="let equipmentType of equipmentTypes" [value]="equipmentType.id">
                  {{ equipmentType.description || recordIdService.getId(equipmentType.id || '') }}
                </option>
              </select>
            </div>

            <div class="form-group">
              <label for="marca">MARCA</label>
              <select id="marca" name="marca" [(ngModel)]="solicitation.marca" class="form-select" required>
                <option value="">Selecione</option>
                <option *ngFor="let brand of brands" [value]="brand">{{ brand }}</option>
              </select>
            </div>

            <div class="form-group">
              <label for="equipamento">EQUIPAMENTO</label>
              <input id="equipamento" name="equipamento" [(ngModel)]="solicitation.equipamento" class="form-control" placeholder="Digite o modelo" type="text" required />
            </div>

            <div class="form-group">
              <label for="cor">COR</label>
              <input id="cor" name="cor" [(ngModel)]="solicitation.cor" class="form-control" placeholder="Digite a cor" type="text" required />
            </div>
          </div>

          <div class="form-group">
            <label for="tipo">TIPO DA SOLICITAÇÃO</label>
            <select id="tipo" name="type" [(ngModel)]="solicitation.type" class="form-select" required>
              <option value="">Selecione</option>
              <option *ngFor="let t of type" [value]="t">{{ t }}</option>
            </select>
          </div>

          <div class="form-group">
            <label for="descricaoServico">NOME DO SERVIÇO</label>
            <textarea id="descricaoServico" name="descricaoServico" [(ngModel)]="solicitation.descricaoServico" class="form-textarea" rows="2" placeholder="Descreva o serviço que será realizado..." required ></textarea>
          </div>

          <div class="form-group">
            <label for="defeitoRelatado">RELATO</label>
            <textarea id="defeitoRelatado" name="defeitoRelatado" [(ngModel)]="solicitation.defeitoRelatado" class="form-textarea" rows="2" placeholder="Informe o defeito que foi identificado..." required ></textarea>
          </div>

          <!-- Botão -->
          <button type="submit" class="register-button">
            CADASTRAR
          </button>
        </form>
      </div>
    </div>

  </div>
</section>
