<section>
  <!-- Container principal com fundo branco -->
  <div class="table-section bg-white p-4 rounded shadow-sm mt-4">

    <!-- Cabeçalho: blob + título + descrição -->
    <div class="cabecalho-solicitacoes text-center mb-4">
      <div class="container-do-titulo">
        <div class="titulo-wrapper">
          <img src="/images/blob.png" alt="Decorativo" class="titulo-blob" />
          <h1 class="titulo-solicitacoes">
            <i class="fas fa-clipboard-list me-2"></i> SOLICITAÇÕES
          </h1>
        </div>
      </div>
      <p class="descricao-solicitacoes">
        Aqui você pode visualizar, criar e gerenciar solicitações de serviço técnico de forma prática.
      </p>
    </div>

<!-- Botões de Acesso Rápido -->
<div class="acoes-wrapper mb-3">
  <button class="btn nova-solicitacao" (click)="abrirFormulario()">
    Nova Solicitação
  </button>
</div>

<div class="table-responsive">
  <table class="table-custom">
    <thead>
      <tr>
        <th>ID</th>
        <th>Data</th>
        <th>Hora</th>
        <th>Equipamento</th>
        <th>Estado</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let s of solicitacoesPorGrupo[0]">
        <td>{{ s.id }}</td>
        <td>{{ s.data }}</td>
        <td>{{ s.hora }}</td>
        <td>{{ s.equipamento }}</td>
        <td>
          <span [ngClass]="'estado-' + (s.estado.trim().toUpperCase())">{{ s.estado }}</span>
        </td>
        <td>
          <button class="btn btn-sm btn-info me-1" (click)="ver(s)">
            <i class="fas fa-eye"></i>
          </button>
          <button class="btn btn-sm btn-warning me-1" (click)="editar(s)">
            <i class="fas fa-pencil-alt"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Paginação -->
<div class="paginacao d-flex justify-content-center align-items-center mt-3 gap-2">
  <button 
    class="btn btn-sm btn-outline-primary" 
    [disabled]="paginaAtual === 1" 
    (click)="mudarPagina(paginaAtual - 1)">
    Anterior
  </button>

  <span>Página {{ paginaAtual }} de {{ totalPaginas }}</span>

  <button 
    class="btn btn-sm btn-outline-primary" 
    [disabled]="paginaAtual === totalPaginas" 
    (click)="mudarPagina(paginaAtual + 1)">
    Próxima
  </button>
</div>
</div> 

</section>
<app-modal-employee-visualizar></app-modal-employee-visualizar>
<app-modal-employee-editar></app-modal-employee-editar>
