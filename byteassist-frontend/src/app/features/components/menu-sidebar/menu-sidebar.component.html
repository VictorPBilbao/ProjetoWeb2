<aside class="d-flex flex-column sidebar open">
  <div class="d-flex">
    <div class="menu-user-container d-flex flex-column menu-padding">
      <div class="d-flex align-items-center">
        <div class="menu-name-initials-container d-flex align-items-center justify-content-center">
          {{ getUserInitals() }}
        </div>

        <div class="menu-user-name">
          {{ user?.person?.name?.first }} {{ user?.person?.name?.last }}
        </div>
      </div>

      <div class="menu-search-container">
        <input type="text" class="form-control" placeholder="Search..." />
        <i class="bi bi-search"></i>
      </div>
    </div>
  </div>

  <nav class="menu-nav d-flex">
    <ul class="nav d-flex flex-column">
      <li class="nav-item" *ngIf="clientLinksVisible">
        <a
          class="nav-link active flex items-center menu-padding"
          aria-current="page"
          routerLink="/dashboard"
          routerLinkActive="active"
        >
          <img src="/images/menu-sidebar/home.png" class="menu-icon">
          <p class="nav-link-text">Dashbord</p>
        </a>
      </li>
      <li class="nav-item" *ngIf="clientLinksVisible">
        <a
          class="nav-link flex items-center menu-padding"
          routerLink="/solicitacoes"
          routerLinkActive="active"
        >
          <img src="/images/menu-sidebar/technical-support.png" class="menu-icon">
          <p class="nav-link-text">Solitações</p>
        </a>
      </li>
      <li class="nav-item" *ngIf="clientLinksVisible">
        <a
          class="nav-link flex items-center menu-padding"
          routerLink="/orcamentos"
          routerLinkActive="active"
        >
          <img src="/images/menu-sidebar/value-chain.png" class="menu-icon">
          <p class="nav-link-text">Orçamentos</p>
        </a>
      </li>

      <!--Emplyee-->
      <li class="nav-item" *ngIf="employeeLinksVisible">
        <a
          class="nav-link flex items-center menu-padding"
          routerLink="/funcionario/solicitacoes"
          routerLinkActive="active"
        >
          <img src="/images/menu-sidebar/technical-support.png" class="menu-icon">
          <p class="nav-link-text">Solitações</p>
        </a>
      </li>
      <li class="nav-item" *ngIf="employeeLinksVisible">
        <a
          class="nav-link flex items-center menu-padding"
          routerLink="/funcionario/orcamentos"
          routerLinkActive="active"
        >
          <img src="/images/menu-sidebar/value-chain.png" class="menu-icon">
          <p class="nav-link-text">Orçamentos</p>
        </a>
      </li>
      <li class="nav-item" *ngIf="employeeLinksVisible">
        <a
          class="nav-link flex items-center menu-padding"
          routerLink="/funcionario/cadastros"
          routerLinkActive="active"
        >
          <img src="/images/menu-sidebar/folder.png" class="menu-icon">
          <p class="nav-link-text">Cadastros</p>
        </a>
      </li>
      <!--Employee- END -->

      <li class="nav-item" *ngIf="clientLinksVisible">
        <a
          class="nav-link flex items-center menu-padding"
          routerLink="/conta"
          routerLinkActive="active"
        >
          <img src="/images/menu-sidebar/user.png" class="menu-icon">
          <p class="nav-link-text">Conta</p>
        </a>
      </li>
      <li class="nav-item" *ngIf="clientLinksVisible">
        <a
          class="nav-link flex items-center menu-padding"
          routerLink="/ajuda"
          routerLinkActive="active"
        >
          <img src="/images/menu-sidebar/customer-support.png" class="menu-icon">
          <p class="nav-link-text">Suporte</p>
        </a>
      </li>


      <li class="nav-item" *ngIf="adminLinksVisible">
        <a
          class="nav-link flex items-center menu-padding"
          routerLink="/admin/funcionarios"
          routerLinkActive="active"
          >
          <img src="/images/menu-sidebar/folder.png" class="menu-icon">
          <p class="nav-link-text">Funcionários</p>
          </a>
      </li>

      <li class="nav-item" *ngIf="adminLinksVisible">
        <a
          class="nav-link flex items-center menu-padding"
          routerLink="/admin/cadastrar-funcionario"
          routerLinkActive="active"
          >
          <img src="/images/menu-sidebar/folder.png" class="menu-icon">
          <p class="nav-link-text">Cadastrar Funcionario</p>
        </a>
      </li>

      <li class="nav-item nav-item-seperator">
        <div class="nav-border"></div>
      </li>

      <li class="nav-item">
        <a
          class="nav-link flex items-center menu-padding"
          (click)="logout()"
        >
          <img src="/images/menu-sidebar/logout.svg" class="menu-icon">
          <p class="nav-link-text">Logout</p>
        </a>
      </li>
    </ul>
  </nav>

  <div class="close-sidebar-container" (click)="openSidebar()">
    <i
      class="bi "
      [class.bi-arrow-left-circle]="sidebarVisible"
      [class.bi-arrow-right-circle]="!sidebarVisible"
    >
    </i>
  </div>
</aside>
