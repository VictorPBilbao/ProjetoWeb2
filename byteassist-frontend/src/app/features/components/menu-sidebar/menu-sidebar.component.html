<aside class="d-flex flex-column sidebar" (click)="openSidebar()">
  <div class="d-flex">
    <div class="menu-user-container d-flex flex-column menu-padding">
      <div class="d-flex align-items-center">
        <div class="menu-name-initials-container d-flex align-items-center justify-content-center">
          VB
        </div>

        <div class="menu-user-name">
          {{ userName }}
        </div>
      </div>

      <div class="menu-search-container">
        <input type="text" class="form-control" placeholder="Search..." />
        <i class="bi bi-search"></i>
      </div>
    </div>
  </div>

  <nav class="menu-nav d-flex">
    <ul class="nav d-flex flex-column">
      <li class="nav-item">
        <a
          class="nav-link active flex items-center menu-padding"
          aria-current="page"
          routerLink="/dashboard"
          routerLinkActive="active"
        >
          <img src="/images/menu-sidebar/monitor-graph.svg" class="menu-icon">
          <p class="nav-link-text">Dashbord</p>
        </a>
      </li>
      <li class="nav-item">
        <a
          class="nav-link flex items-center menu-padding"
          routerLink="/employee"
          routerLinkActive="active"
        >
          <img src="/images/menu-sidebar/maintenance.svg" class="menu-icon">
          <p class="nav-link-text">Solitações</p>
        </a>
      </li>
      <li class="nav-item">
        <a
          class="nav-link flex items-center menu-padding"
          routerLink="/budget"
          routerLinkActive="active"
        >
          <img src="/images/menu-sidebar/money-recive.svg" class="menu-icon">
          <p class="nav-link-text">Orçamentos</p>
        </a>
      </li>
      <li class="nav-item">
        <a
          class="nav-link flex items-center menu-padding"
          routerLink="/payment"
          routerLinkActive="active"
        >
          <img src="/images/menu-sidebar/payment-method.svg" class="menu-icon">
          <p class="nav-link-text">Pagamentos</p>
        </a>
      </li>
      <li class="nav-item">
        <a
          class="nav-link flex items-center menu-padding"
          routerLink="/account"
          routerLinkActive="active"
        >
          <img src="/images/menu-sidebar/account.svg" class="menu-icon">
          <p class="nav-link-text">Configurações</p>
        </a>
      </li>
      <li class="nav-item">
        <a
          class="nav-link flex items-center menu-padding"
          routerLink="/help"
          routerLinkActive="active"
        >
          <img src="/images/menu-sidebar/customer-service.svg" class="menu-icon">
          <p class="nav-link-text">Suporte</p>
        </a>
      </li>
      <li class="nav-item nav-item-seperator">
        <div class="nav-border"></div>
      </li>
      <li class="nav-item">
        <a
          class="nav-link flex items-center menu-padding"
          (click)="logout()"
        >
          <img src="/images/menu-sidebar/logout.svg" class="menu-icon">
          <p class="nav-link-text">Logout</p>
        </a>
      </li>
    </ul>
  </nav>
</aside>
