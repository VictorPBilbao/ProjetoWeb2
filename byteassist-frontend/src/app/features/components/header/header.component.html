<header class="header">
  <div class="logo-container">
    <img [src]="logoPath" alt="ByteAssist Logo" class="logo-img">
    <span class="company-name">
      <h1>{{ companyName }}</h1>
    </span>
  </div>

  <nav class="nav">
    <!-- Menu principal -->
    <a href="#home" class="nav-item">
      <i class="bi bi-house-door"></i>
      <span class="nav-text">Home</span>
    </a>

    <a href="#servicos" class="nav-item">
      <i class="bi bi-scissors"></i>
      <span class="nav-text">Serviços</span>
    </a>

    <a href="#clientes" class="nav-item">
      <i class="bi bi-people"></i>
      <span class="nav-text">Clientes</span>
    </a>

    <a href="#sobre" class="nav-item">
      <i class="bi bi-building"></i>
      <span class="nav-text">Sobre Nós</span>
    </a>

    <a href="#contato" class="nav-item">
      <i class="bi bi-envelope"></i>
      <span class="nav-text">Contato</span>
    </a>

    <!-- Login (separado) -->
    <a routerLink="/login" class="nav-item login-btn" routerLinkActive="active">
      <i class="bi bi-box-arrow-in-right"></i>
      <span class="nav-text">Login</span>
    </a>
  </nav>
</header>
