<!-- Modal: Editar -->
    <div #modalRef class="modal fade" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form (ngSubmit)="salvarEdicao()" #formEditar="ngForm">
            <div class="modal-header">
              <h5 class="modal-title">Editar Solicitação</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label">Categoria</label>
                <select class="form-select" [(ngModel)]="selecionado.categoria" name="categoria" [disabled]="selecionado.estado === 'FINALIZADA'">
                  <option *ngFor="let c of categorias" [value]="c">{{ c }}</option>
                </select>
              </div>
              <div class="row mb-3">
                <div class="col-md-6">
                  <label class="form-label">Data</label>
                  <input type="date" class="form-control" [(ngModel)]="selecionado.data" name="data" readonly>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Hora</label>
                  <input type="time" class="form-control" [(ngModel)]="selecionado.hora" name="hora" readonly>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label">Cor</label>
                <input type="text" class="form-control" [(ngModel)]="selecionado.cor" name="cor" readonly>
              </div>
              <div class="mb-3">
                <label class="form-label">Defeito Relatado</label>
                <textarea class="form-control" rows="2" [(ngModel)]="selecionado.defeitoRelatado" name="defeitoRelatado" [disabled]="selecionado.estado === 'FINALIZADA'"></textarea>
              </div>
              <div class="mb-3">
                <label class="form-label">Descrição do Serviço</label>
                <textarea class="form-control" rows="3" [(ngModel)]="selecionado.descricaoServico" name="descricaoServico" [disabled]="selecionado.estado === 'FINALIZADA'"></textarea>
              </div>
              <div class="mb-3">
                <label class="form-label">Estado</label>
                <input type="text" class="form-control" [(ngModel)]="selecionado.estado" name="estado" readonly>
              </div>
              <div class="mb-3">
                <label class="form-label">ID</label>
                <input type="text" class="form-control" [(ngModel)]="selecionado.id" name="id" readonly>
              </div>
              <div class="mb-3">
                <label class="form-label">Marca</label>
                <select class="form-select" [(ngModel)]="selecionado.marca" name="marca" [disabled]="selecionado.estado === 'FINALIZADA'">
                  <option *ngFor="let m of marcas" [value]="m">{{ m }}</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Orçamento</label>
                <input type="text" class="form-control" [(ngModel)]="selecionado.orcamento" name="orcamento" readonly>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-primary" type="submit" *ngIf="selecionado.estado !== 'FINALIZADA'">Salvar</button>

              <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
